<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="converter">
        <h1>Temperature Converter</h1>
        <p>Convert temperatures easily and instantly.</p>

        <label for="temperature">Enter Temperature</label>
        <input type="number" id="temperature"
               placeholder="Enter a value" step="any">

        <label for="unit">Convert From</label>
        <select id="unit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <button id="convertBtn">Convert Temperature</button>

        <p id="message" role="alert"></p>

        <section id="results" aria-live="polite" hidden>
            <h2>Conversion Results</h2>
            <p id="celsius"></p>
            <p id="fahrenheit"></p>
            <p id="kelvin"></p>
        </section>
    </main>
</body>
</html>
